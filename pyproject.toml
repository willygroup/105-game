[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "105-game"
version = "0.0.2a"
description = "This is a clone of the arcade game 'Premium d'oro slot machine'"
authors = [{ name = "Daniele Forti", email = "willygroup@gmail.com" }]
dependencies = [
  "pyinstaller",
  "ruff",
  "pylint",
  "gitpython",
  "tomli",
  "playsound",
  "rich",
  "pyfiglet",
  "textual",
]

[tool.myproject]
"githash" = "LOCAL"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
  "F",   # pyflakes
  "E",   # pycodestyle
  "I",   # isort
  "ANN", # flake8 type annotations
  "RUF", # ruff-specific rules
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"
